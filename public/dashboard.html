<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — VMdex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-ambient"></div>

  <header>
    <div class="wrap">
      <nav>
        <a href="/" class="brand">
          <img src="https://media.discordapp.net/attachments/1513625171343315024/1530493207832432671/Screenshot_2026-07-25-13-08-40-59_dba69a5e82e939c3ddef13f99a115ca3-removebg-preview_2.png?ex=6a65c65f&is=6a6474df&hm=289f5ec8073dab9995c710ee982373af05cc2ad32e79498ba1e441e29ce5c4fc&=&format=webp&quality=lossless&width=636&height=613" alt="VMDEX Logo" class="brand-logo">
          <span class="brand-text">VMDEX</span>
        </a>
        <div class="nav-links">
          <a href="/">Home</a>
          <a href="https://discord.gg/HDReGsmd45" target="_blank">Discord</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="dashboard-panel">
      <div class="dash-header">
        <h1>Obfuscate Script</h1>
        <p>Select your file or paste your Luau code below to protect it.</p>
      </div>

      <div class="tab-group">
        <button class="tab-btn active">Paste Code</button>
        <button class="tab-btn">Upload File (.luau / .lua)</button>
      </div>

      <textarea class="code-textarea" placeholder="-- Paste your Roblox Luau script here..."></textarea>

      <div class="dash-actions">
        <button class="btn btn-primary">Obfuscate Script</button>
      </div>

      <div class="dash-header">
        <h2>Obfuscated Result</h2>
      </div>
      <textarea class="code-textarea" readonly placeholder="-- Obfuscated code will appear here..."></textarea>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <div class="foot">
        <span>© 2026 VMdex. Built for Roblox developers.</span>
        <div class="foot-links">
          <a href="https://discord.gg/HDReGsmd45" target="_blank">Discord</a>
        </div>
      </div>
    </div>
  </footer>

</body>
</html>
