<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMdex | Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="brand-logo">
      <span class="logo-v">V</span><span class="logo-m">M</span><span class="logo-d">D</span><span class="logo-e">E</span><span class="logo-x">X</span>
    </div>
    <div class="nav-links">
      <span style="color: var(--text-muted); font-size: 0.9rem;">Workspace</span>
      <a href="index.html" class="btn-secondary">Logout</a>
    </div>
  </nav>

  <div class="dashboard-container">
    <div class="dashboard-header">
      <h2>Obfuscate Script</h2>
      <p>Select your file or paste your Luau code below to protect it.</p>
    </div>

    <div class="editor-panel">
      <div class="tab-header">
        <button class="tab-btn active" id="tabPaste" onclick="switchMode('paste')">Paste Code</button>
        <button class="tab-btn" id="tabUpload" onclick="switchMode('upload')">Upload File (.luau / .lua)</button>
      </div>

      <div id="pasteSection" class="input-section">
        <textarea id="scriptInput" placeholder="-- Paste your Roblox Luau script here..."></textarea>
      </div>

      <div id="uploadSection" class="input-section" style="display: none;">
        <div class="file-drop-zone">
          <p>Drag & Drop your script file here or</p>
          <input type="file" id="fileInput" accept=".lua,.luau,.txt" onchange="handleFileUpload(event)">
        </div>
      </div>

      <div id="errorBanner" class="error-banner"></div>

      <div class="action-bar">
        <button class="btn-primary" onclick="processObfuscation()">Obfuscate Script</button>
      </div>

      <div class="output-section">
        <label>Obfuscated Result:</label>
        <textarea id="scriptOutput" readonly placeholder="-- Obfuscated code will appear here..."></textarea>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
